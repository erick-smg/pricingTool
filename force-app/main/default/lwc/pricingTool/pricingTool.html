<template>
  <lightning-card title="SMG Pricing Tool" icon-name="standard:pricebook">
    <div class="slds-p-around_medium">
      <lightning-layout multiple-rows="true">
        <lightning-layout-item size="4" padding="around-small">
          <lightning-input
            data-id="locations-input"
            type="number"
            label="Locations"
            value={locations}
            min="0"
            step="1"
            onchange={handleLocationsChange}
          ></lightning-input>
        </lightning-layout-item>
        <lightning-layout-item size="8" padding="around-small">
          <p class="slds-text-title">Package</p>
          <p class="slds-text-heading_small slds-m-bottom_x-small">
            Ignite Platform
          </p>
          <p class="slds-text-body_small">
            Included, for reference only — not selectable:
            <template for:each={ignitePlatformItems} for:item="item">
              <span key={item} class="slds-badge slds-m-right_xx-small">{item}</span>
            </template>
          </p>
        </lightning-layout-item>
      </lightning-layout>

      <template if:true={locationsMissing}>
        <div
          class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_small"
          role="alert"
        >
          {locationsRequiredMessage}
        </div>
      </template>

      <lightning-tabset variant="scoped">
        <!-- ============ QUOTE BUILDER ============ -->
        <lightning-tab label="Quote Builder">
          <template if:true={isExpansionOpportunity}>
            <lightning-input
              data-id="include-base-package-toggle"
              type="checkbox"
              label="Include Ignite Platform base package"
              checked={includeBasePackage}
              onchange={handleIncludeBasePackageToggle}
              class="slds-m-bottom_small"
            ></lightning-input>
          </template>

          <template if:false={includeBasePackageInQuote}>
            <p class="slds-text-body_small slds-m-bottom_small" style="color: #706e6b">
              Standalone add-ons quote — the Ignite Platform base package (and its Service
              Tier/Term) is excluded. Check the box above to add it back in.
            </p>
          </template>

          <template if:true={includeBasePackageInQuote}>
            <lightning-layout multiple-rows="true">
              <lightning-layout-item size="6" padding="around-small">
                <lightning-combobox
                  data-id="service-tier-combobox"
                  label="Service Tier"
                  value={serviceTier}
                  options={serviceTierOptions}
                  onchange={handleServiceTierChange}
                ></lightning-combobox>
              </lightning-layout-item>
              <lightning-layout-item size="6" padding="around-small">
                <lightning-combobox
                  data-id="term-combobox"
                  label="Term"
                  value={termMonths}
                  options={termOptions}
                  onchange={handleTermChange}
                ></lightning-combobox>
              </lightning-layout-item>
            </lightning-layout>
          </template>

          <h3
            class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small"
          >
            Add-Ons (over and above base package)
          </h3>
          <lightning-layout multiple-rows="true">
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Languages ($2,500 survey + $7,500 report per language)"
                data-field="additionalLanguages"
                value={additionalLanguages}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Surveys ($30,000/survey)"
                data-field="additionalSurveys"
                value={additionalSurveys}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
              <template if:true={additionalSurveys}>
                <lightning-checkbox-group
                  data-id="additional-survey-types"
                  label="Survey Types"
                  options={additionalSurveyTypeOptions}
                  value={additionalSurveyTypes}
                  onchange={handleAdditionalSurveyTypesChange}
                  class="slds-m-top_x-small"
                ></lightning-checkbox-group>
              </template>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Survey Revisions ($1,500/revision)"
                data-field="additionalSurveyRevisions"
                value={additionalSurveyRevisions}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Integrations ($10,000/integration)"
                data-field="additionalIntegrations"
                value={additionalIntegrations}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Brands ($6,000/brand)"
                data-field="additionalBrands"
                value={additionalBrands}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Performance ($12,000/unit)"
                data-field="additionalPerformance"
                value={additionalPerformance}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Agile ($15,000/unit)"
                data-field="additionalAgile"
                value={additionalAgile}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                type="number"
                label="Add'l Consultative ($35,000/unit)"
                data-field="additionalConsultative"
                value={additionalConsultative}
                min="0"
                step="1"
                onchange={handleAddOnQtyChange}
              ></lightning-input>
            </lightning-layout-item>
          </lightning-layout>

          <template if:true={selectedAddOnLines.length}>
            <table
              data-id="add-ons-table"
              class="slds-table slds-table_bordered slds-table_cell-buffer slds-m-top_small"
            >
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">Add-On</th>
                  <th scope="col">Qty</th>
                  <th scope="col">$/Loc/Mo</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={selectedAddOnLines} for:item="line">
                  <tr key={line.key}>
                    <td>{line.label}</td>
                    <td>{line.quantity}</td>
                    <td>
                      <lightning-formatted-number
                        value={line.perLocPerMonth}
                        format-style="currency"
                        currency-code="USD"
                      ></lightning-formatted-number>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>

          <h3
            class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small"
          >
            Ignite Add-Ons
          </h3>
          <lightning-layout multiple-rows="true">
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="agent-track-toggle"
                type="checkbox"
                label="AgentTrack"
                checked={agentTrackEnabled}
                onchange={handleAgentTrackToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="rr-toggle"
                type="checkbox"
                label="Reputation Management"
                checked={ratingsReviewsEnabled}
                onchange={handleRatingsReviewsToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="ignite-ex-toggle"
                type="checkbox"
                label="Ignite EX"
                checked={igniteExEnabled}
                onchange={handleIgniteExToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="ignite-communities-toggle"
                type="checkbox"
                label="Ignite Communities"
                checked={igniteCommunitiesEnabled}
                onchange={handleIgniteCommunitiesToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="ignite-digital-toggle"
                type="checkbox"
                label="Ignite Digital"
                checked={igniteDigitalEnabled}
                onchange={handleIgniteDigitalToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="case-management-toggle"
                type="checkbox"
                label="Case Premium ($7,500 one-time)"
                checked={caseManagementEnabled}
                onchange={handleCaseManagementToggle}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="4" padding="around-small">
              <lightning-input
                data-id="setup-fee-toggle"
                type="checkbox"
                label={setupFeeLabel}
                checked={setupFeeEnabled}
                onchange={handleSetupFeeToggle}
              ></lightning-input>
            </lightning-layout-item>
          </lightning-layout>

          <template if:true={agentTrackEnabled}>
            <div class="slds-box slds-theme_default slds-m-top_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                AgentTrack (call center)
              </h3>
              <lightning-layout multiple-rows="true">
                <lightning-layout-item size="6" padding="around-small">
                  <p class="slds-text-title">Variant</p>
                  <p class="slds-text-body_regular">Agent Experience</p>
                </lightning-layout-item>
                <lightning-layout-item size="6" padding="around-small">
                  <lightning-combobox
                    data-id="agent-count-band-combobox"
                    label="Number of Agents"
                    value={agentCountBand}
                    options={agentCountBandOptions}
                    onchange={handleAgentCountBandChange}
                  ></lightning-combobox>
                </lightning-layout-item>
              </lightning-layout>
              <p class="slds-m-top_x-small">
                AgentTrack:
                <lightning-formatted-number
                  value={callCenterResult.perLocPerMonth}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
                / Loc / Mo (<lightning-formatted-number
                  value={callCenterResult.annualTotal}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
                annual total)
              </p>
            </div>
          </template>

          <template if:true={ratingsReviewsEnabled}>
            <div class="slds-box slds-theme_default slds-m-top_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                Reputation Management
              </h3>
              <lightning-radio-group
                data-id="rr-tier-radio-group"
                label="Product Tier"
                options={ratingsReviewsTierOptions}
                value={ratingsReviewsTier}
                onchange={handleRatingsReviewsTierChange}
                class="slds-m-bottom_medium"
              ></lightning-radio-group>

              <lightning-checkbox-group
                data-id="reputation-extras"
                label="Additional Services"
                options={reputationManagementExtraOptions}
                value={reputationManagementExtras}
                onchange={handleReputationManagementExtrasChange}
                class="slds-m-bottom_medium"
              ></lightning-checkbox-group>

              <template if:true={ratingsReviewsResult}>
                <div class="slds-box slds-theme_shade">
                  <p>
                    Bracket:
                    <strong>{ratingsReviewsResult.bracket}</strong> locations
                  </p>
                  <lightning-layout multiple-rows="true">
                    <lightning-layout-item size="4" padding="around-small">
                      <p class="slds-text-title">Rate / Loc / Mo</p>
                      <p class="slds-text-heading_small">
                        <lightning-formatted-number
                          value={ratingsReviewsResult.ratePerMonth}
                          format-style="currency"
                          currency-code="USD"
                        ></lightning-formatted-number>
                      </p>
                    </lightning-layout-item>
                    <lightning-layout-item size="4" padding="around-small">
                      <p class="slds-text-title">Monthly</p>
                      <p class="slds-text-heading_small">
                        <lightning-formatted-number
                          value={ratingsReviewsResult.monthly}
                          format-style="currency"
                          currency-code="USD"
                        ></lightning-formatted-number>
                      </p>
                    </lightning-layout-item>
                    <lightning-layout-item size="4" padding="around-small">
                      <p class="slds-text-title">Annual</p>
                      <p class="slds-text-heading_small">
                        <lightning-formatted-number
                          value={ratingsReviewsResult.annual}
                          format-style="currency"
                          currency-code="USD"
                        ></lightning-formatted-number>
                      </p>
                    </lightning-layout-item>
                  </lightning-layout>
                </div>
              </template>
            </div>
          </template>

          <template if:true={igniteExEnabled}>
            <div class="slds-box slds-theme_default slds-m-top_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                Ignite EX
              </h3>
              <lightning-checkbox-group
                data-id="ignite-ex-items"
                label="Select all that apply"
                options={igniteExItemOptions}
                value={igniteExSelectedItems}
                onchange={handleIgniteExItemsChange}
                class="slds-m-bottom_medium"
              ></lightning-checkbox-group>

              <template if:true={igniteExPulseSelected}>
                <lightning-input
                  data-id="ignite-ex-pulse-quantity"
                  type="number"
                  label="Number of Pulses"
                  value={igniteExPulseQuantity}
                  min="0"
                  step="1"
                  onchange={handleIgniteExPulseQuantityChange}
                  class="slds-m-bottom_medium"
                ></lightning-input>
              </template>

              <template if:true={igniteExResult.isCustomPricing}>
                <div
                  class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-m-bottom_small"
                  role="alert"
                >
                  {locations} locations is above the 10,000-location Ignite EX
                  rate card ceiling — confirm pricing with the deal desk.
                </div>
              </template>

              <p>
                Ignite EX:
                <lightning-formatted-number
                  value={igniteExResult.annualTotal}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
                annual ·
                <lightning-formatted-number
                  value={igniteExResult.oneTimeTotal}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
                one-time
              </p>
            </div>
          </template>

          <template if:true={igniteCommunitiesEnabled}>
            <div class="slds-box slds-theme_default slds-m-top_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                Ignite Communities Calculator
              </h3>
              <p class="slds-text-body_small slds-m-bottom_small">
                Rolls up into the single Ignite Communities line item — no
                separate products for platform, recruitment, or servicing.
              </p>

              <lightning-layout multiple-rows="true">
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-combobox
                    data-id="community-tier-combobox"
                    label="Tier"
                    value={communityTier}
                    options={communityTierOptions}
                    onchange={handleCommunityTierChange}
                  ></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-input
                    data-id="community-markets-input"
                    type="number"
                    label="Number of Markets"
                    value={communityMarkets}
                    min="1"
                    step="1"
                    onchange={handleCommunityMarketsChange}
                  ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-input
                    data-id="community-size-input"
                    type="number"
                    label="Community Size per Market"
                    value={communitySizePerMarket}
                    min="0"
                    step="1"
                    onchange={handleCommunitySizeChange}
                  ></lightning-input>
                  <p class="slds-text-body_small">
                    {communityTierSpec.includedCommunitySize} included — $10/member
                    over that, per market.
                  </p>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-input
                    data-id="community-agile-input"
                    type="number"
                    label="Additional AGILE Projects"
                    value={communityAdditionalAgileProjects}
                    min="0"
                    step="1"
                    disabled={communityAgileDisabled}
                    onchange={handleCommunityAgileChange}
                  ></lightning-input>
                  <template if:true={communityAgileDisabled}>
                    <p class="slds-text-body_small">Not available on this tier.</p>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-input
                    data-id="community-consultancy-input"
                    type="number"
                    label="Additional CONSULTANCY Studies"
                    value={communityAdditionalConsultancyProjects}
                    min="0"
                    step="1"
                    disabled={communityConsultancyDisabled}
                    onchange={handleCommunityConsultancyChange}
                  ></lightning-input>
                  <template if:true={communityConsultancyDisabled}>
                    <p class="slds-text-body_small">Not available on this tier.</p>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <lightning-input
                    data-id="community-admin-input"
                    type="number"
                    label="Additional Admin Users"
                    value={communityAdditionalAdminUsers}
                    min="0"
                    step="1"
                    disabled={communityAdminOverageDisabled}
                    onchange={handleCommunityAdminChange}
                  ></lightning-input>
                  <template if:true={communityAdminOverageDisabled}>
                    <p class="slds-text-body_small">Unlimited admins included.</p>
                  </template>
                </lightning-layout-item>
              </lightning-layout>

              <p class="slds-m-top_small">
                Ignite Communities:
                <strong>
                  <lightning-formatted-number
                    value={communityQuote.totalAnnual}
                    format-style="currency"
                    currency-code="USD"
                  ></lightning-formatted-number>
                </strong>
                / year ({communityTierDiscountPercentDisplay}% tier discount applied)
              </p>
            </div>
          </template>

          <template if:true={igniteDigitalEnabled}>
            <div class="slds-box slds-theme_default slds-m-top_medium">
              <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                Ignite Digital
              </h3>
              <lightning-checkbox-group
                data-id="ignite-digital-extras"
                label="Additional Services"
                options={igniteDigitalExtraOptions}
                value={igniteDigitalExtras}
                onchange={handleIgniteDigitalExtrasChange}
              ></lightning-checkbox-group>

              <template if:true={mouseflowConfigSelected}>
                <lightning-radio-group
                  data-id="mouseflow-tier-radio-group"
                  label="Mouseflow Config Tier"
                  options={mouseflowTierOptions}
                  value={mouseflowTier}
                  onchange={handleMouseflowTierChange}
                  class="slds-m-top_small"
                ></lightning-radio-group>
              </template>

              <p class="slds-text-body_small slds-m-top_x-small">
                Mouseflow Config is priced by its own tier — $45,000
                Essential / $75,000 Advanced / $110,000 Elite — independent
                of the quote's Service Tier. Contact Us (Inform) is a flat
                $30,000/year.
              </p>
              <template if:true={igniteDigitalExtrasResult.lines.length}>
                <p class="slds-m-top_x-small">
                  Ignite Digital extras:
                  <lightning-formatted-number
                    value={igniteDigitalExtrasResult.annualTotal}
                    format-style="currency"
                    currency-code="USD"
                  ></lightning-formatted-number>
                  / year
                </p>
              </template>
            </div>
          </template>

          <div class="slds-box slds-theme_default slds-m-top_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
              Quoted Price
            </h3>

            <template if:true={includeBasePackageInQuote}>
              <template if:true={baseQuote.isCustomPricing}>
                <div
                  class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-m-bottom_small"
                  role="alert"
                >
                  {locations} locations is above the 5,000-location rate card
                  ceiling — this uses custom pricing. Confirm with the deal
                  desk before quoting.
                </div>
              </template>
              <template if:true={baseQuote.floorApplied}>
                <div class="slds-text-body_small slds-m-bottom_small">
                  Annual minimum applied — the calculated rate fell below the
                  tier's annual floor.
                </div>
              </template>
            </template>

            <lightning-layout multiple-rows="true">
              <lightning-layout-item size="4" padding="around-small">
                <p class="slds-text-title">Per Location / Month</p>
                <p class="slds-text-heading_medium">
                  <lightning-formatted-number
                    data-id="quoted-price-per-location"
                    value={listPricePerLocationPerMonth}
                    format-style="currency"
                    currency-code="USD"
                  ></lightning-formatted-number>
                </p>
              </lightning-layout-item>
              <lightning-layout-item size="4" padding="around-small">
                <p class="slds-text-title">Monthly</p>
                <p class="slds-text-heading_medium">
                  <lightning-formatted-number
                    data-id="quoted-price-monthly"
                    value={listMonthly}
                    format-style="currency"
                    currency-code="USD"
                  ></lightning-formatted-number>
                </p>
              </lightning-layout-item>
              <lightning-layout-item size="4" padding="around-small">
                <p class="slds-text-title">Annual</p>
                <p class="slds-text-heading_medium">
                  <lightning-formatted-number
                    data-id="quoted-price-annual"
                    value={listAnnual}
                    format-style="currency"
                    currency-code="USD"
                  ></lightning-formatted-number>
                </p>
              </lightning-layout-item>
            </lightning-layout>

            <div
              class="slds-text-body_small slds-m-top_small slds-m-bottom_small"
            >
              <strong>Discount guidance:</strong> {discountGuidance}
            </div>

            <lightning-input
              data-id="discount-input"
              type="number"
              label="Modeled discount % (max 10%)"
              value={discountPercent}
              min="0"
              max="10"
              step="1"
              onchange={handleDiscountChange}
              class="slds-m-bottom_small"
            ></lightning-input>

            <template if:true={hasDiscount}>
              <lightning-layout multiple-rows="true">
                <lightning-layout-item size="4" padding="around-small">
                  <p class="slds-text-title">Discounted / Loc / Mo</p>
                  <p class="slds-text-heading_small">
                    <lightning-formatted-number
                      value={discountedPerLocationPerMonth}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </p>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <p class="slds-text-title">Discounted Monthly</p>
                  <p class="slds-text-heading_small">
                    <lightning-formatted-number
                      value={discountedMonthly}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </p>
                </lightning-layout-item>
                <lightning-layout-item size="4" padding="around-small">
                  <p class="slds-text-title">Discounted Annual</p>
                  <p class="slds-text-heading_small">
                    <lightning-formatted-number
                      value={discountedAnnual}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </p>
                </lightning-layout-item>
              </lightning-layout>
            </template>
          </div>
        </lightning-tab>

        <!-- ============ DISCOVERY GUIDE ============ -->
        <lightning-tab label="Discovery Guide">
          <h3 class="slds-text-heading_small slds-m-bottom_x-small">
            Must-haves the sellers need to know before quoting
          </h3>
          <ul class="slds-list_dotted slds-m-bottom_medium">
            <li>Locations (e.g. 2,500)</li>
            <li>Brands (e.g. 2 brands)</li>
            <li>Additional integrations (each way) — 4 standard included</li>
            <li>Languages — English &amp; Spanish included</li>
            <li>Additional surveys</li>
            <li>Reputation Management needed?</li>
            <li>Google-only, or more directories needed?</li>
            <li>Responses to reviews needed, or simply visibility to data?</li>
            <li>
              Any managed services for Reputation Management needed
              (listings management, local pages, white-glove responses)?
            </li>
            <li>Do they have a customer community today?</li>
            <li>
              Are communities specifically requested (vs. "nice to have")?
            </li>
            <li>Do they have an EX program today?</li>
            <li>Is EX specifically requested (vs. "nice to have")?</li>
          </ul>

          <h3 class="slds-text-heading_small slds-m-bottom_x-small">
            Ignite Platform
          </h3>
          <p class="slds-text-body_small slds-m-bottom_small">
            The base package on every quote — Service Tier (Foundational,
            Advanced, or Elite) sets the price; Locations sets the base
            rate-card band. Everything else (AgentTrack, Reputation
            Management, Ignite EX, Ignite Communities, Ignite Digital, Case
            Premium, Setup Fee) is an independent add-on checkbox, not tied
            to a package bundle.
          </p>
          <div class="slds-box slds-m-bottom_small">
            <h4 class="slds-text-heading_x-small">Included with every quote</h4>
            <ul class="slds-list_dotted">
              <template for:each={ignitePlatformItems} for:item="item">
                <li key={item}>{item}</li>
              </template>
            </ul>
          </div>

          <h3
            class="slds-text-heading_small slds-m-top_large slds-m-bottom_x-small"
          >
            Managed Listing Management — Reference Pricing ($/Loc/Mo)
          </h3>
          <p class="slds-text-body_small slds-m-bottom_x-small">
            Reference only — not wired into the calculator on the Quote
            Builder tab. The source spreadsheet's column layout for this
            block (ChatExec / Local Pages breakpoints) is ambiguous; confirm
            with the model owner before quoting off these figures.
          </p>
          <table class="slds-table slds-table_bordered slds-table_cell-buffer">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">Locations</th>
                <th scope="col">Premium</th>
                <th scope="col">Pro</th>
                <th scope="col">Basic</th>
              </tr>
            </thead>
            <tbody>
              <template
                for:each={managedListingManagementReference}
                for:item="row"
              >
                <tr key={row.locations}>
                  <td>{row.locations}</td>
                  <td>
                    <lightning-formatted-number
                      value={row.premium}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </td>
                  <td>
                    <lightning-formatted-number
                      value={row.pro}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </td>
                  <td>
                    <lightning-formatted-number
                      value={row.basic}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </lightning-tab>
      </lightning-tabset>

      <div class="slds-box slds-theme_shade slds-m-top_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          Quote Summary
        </h3>

        <template if:true={lineItemsForDisplay.length}>
          <div class="slds-var-m-bottom_small" style="overflow-x: auto">
            <table
              class="slds-table slds-table_bordered slds-table_cell-buffer"
            >
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">Product</th>
                  <th scope="col">Qty</th>
                  <th scope="col">Price</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={lineItemsForDisplay} for:item="line">
                  <tr key={line.key}>
                    <td>
                      {line.description}
                      <template if:true={line.isOneTime}>
                        <span class="slds-text-body_small">&nbsp;(one-time)</span>
                      </template>
                    </td>
                    <td>{line.quantity}</td>
                    <td>
                      <lightning-formatted-number
                        value={line.totalPrice}
                        format-style="currency"
                        currency-code="USD"
                      ></lightning-formatted-number>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template if:false={lineItemsForDisplay.length}>
          <p class="slds-text-body_small slds-m-bottom_small">
            No products selected yet.
          </p>
        </template>

        <div
          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap"
        >
          <div>
            <p class="slds-text-title">Total</p>
            <p class="slds-text-heading_medium">
              <lightning-formatted-number
                value={lineItemsGrandTotal}
                format-style="currency"
                currency-code="USD"
              ></lightning-formatted-number>
            </p>
            <p class="slds-text-body_small">
              Recurring:
              <lightning-formatted-number
                value={recurringLineItemsTotal}
                format-style="currency"
                currency-code="USD"
              ></lightning-formatted-number>
              · One-time:
              <lightning-formatted-number
                value={oneTimeLineItemsTotal}
                format-style="currency"
                currency-code="USD"
              ></lightning-formatted-number>
            </p>
            <template if:true={recurringLineItemsTotal}>
              <p class="slds-text-body_small">
                Recurring Yr 2 (4% escalator):
                <lightning-formatted-number
                  value={threeYearProjection.year2}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
                · Yr 3:
                <lightning-formatted-number
                  value={threeYearProjection.year3}
                  format-style="currency"
                  currency-code="USD"
                ></lightning-formatted-number>
              </p>
            </template>
          </div>
          <div class="slds-grid slds-gutters_x-small">
            <div class="slds-col">
              <lightning-button
                data-id="export-pptx-button"
                variant="neutral"
                label="Export to PowerPoint"
                disabled={exportPowerPointDisabled}
                onclick={handleExportPowerPoint}
              ></lightning-button>
            </div>
            <div class="slds-col">
              <lightning-button
                data-id="add-products-button"
                variant="brand"
                label="Add Products to Opportunity"
                disabled={addProductsDisabled}
                onclick={handleAddProductsToOpportunity}
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
